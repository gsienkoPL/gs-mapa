name: Sync z repozytorium źródłowego

# To repozytorium jest publiczną kopią wydań wtyczki GS Mapa: pakiet gs_mapa/,
# README, licencja, zrzuty ekranu i archiwa ZIP w release'ach. Źródłem jest
# prywatne repozytorium gsienkoPL/gs-mapa-qgis, do którego ten workflow ma
# dostęp tylko do odczytu (klucz wdrożeniowy w sekrecie SOURCE_DEPLOY_KEY).
#
# Workflow uruchamia się co 30 minut i ręcznie: bierze najwyższy tag wydania
# ze źródła, kopiuje z niego pakiet wtyczki, buduje ZIP i publikuje release.
# Nic nie jest wysyłane w drugą stronę — zmiany robi się wyłącznie w źródle.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  SOURCE_REPO: gsienkoPL/gs-mapa-qgis

jobs:
  sync:
    name: Kopiuj wydanie ze źródła
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz to repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj klucz do repozytorium źródłowego
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SOURCE_DEPLOY_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Wybierz najnowszy tag wydania
        id: release
        run: |
          set -euo pipefail
          tags=$(git ls-remote --tags --refs "git@github.com:${SOURCE_REPO}.git" | awk -F/ '{print $NF}')
          if [ -z "$tags" ]; then
            echo "Repozytorium źródłowe nie ma tagów wydań." >&2
            exit 1
          fi
          tag=$(printf '%s\n' "$tags" | sort -V | tail -n 1)
          echo "Najnowszy tag w źródle: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Pobierz źródło wydania
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${{ steps.release.outputs.tag }}" \
            "git@github.com:${SOURCE_REPO}.git" "$RUNNER_TEMP/source"

      - name: Sprawdź spójność i zbuduj archiwum ZIP
        working-directory: ${{ runner.temp }}/source
        run: |
          set -euo pipefail
          python3 scripts/release.py check
          # ZIP powstaje poza katalogiem roboczym — do repozytorium trafia tylko
          # jako asset release'a, nigdy jako plik w drzewie.
          python3 scripts/release.py build --out "$RUNNER_TEMP/dist/gs_mapa.zip"
          python3 - "$RUNNER_TEMP/dist/gs_mapa.zip" <<'PY'
          import sys
          import zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "gs_mapa/metadata.txt" in names, "ZIP bez gs_mapa/metadata.txt"
          print("plików w ZIP:", len(names))
          PY

      - name: Zsynchronizuj pliki wtyczki
        run: |
          set -euo pipefail
          rsync -a --delete "$RUNNER_TEMP/source/gs_mapa/" gs_mapa/
          rsync -a --delete "$RUNNER_TEMP/source/assets/" assets/
          cp "$RUNNER_TEMP/source/LICENSE" LICENSE
          python3 - "$RUNNER_TEMP/source/README.md" README.md <<'PY'
          import pathlib
          import re
          import sys

          src, dst = (pathlib.Path(arg) for arg in sys.argv[1:3])
          text = src.read_text(encoding="utf-8")
          section = re.compile(r"^## Dla deweloperów\n.*?(?=^## |\Z)", re.S | re.M)
          note = (
              "## Kod źródłowy\n\n"
              "To repozytorium zawiera wyłącznie wydania wtyczki: pakiet `gs_mapa/`,\n"
              "README, licencję i archiwa ZIP w zakładce *Releases*. Repozytorium z kodem\n"
              "źródłowym, testami i dokumentacją wewnętrzną jest prywatne — zmiany trafiają\n"
              "tu razem z kolejnymi wydaniami.\n\n"
          )
          text, replaced = section.subn(note, text)
          if replaced != 1:
              sys.exit(f"README: oczekiwano jednej sekcji 'Dla deweloperów', jest {replaced}")
          dst.write_text(text, encoding="utf-8")
          PY

      - name: Commit i push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Bez zmian — pliki już odpowiadają wydaniu ${{ steps.release.outputs.tag }}."
            exit 0
          fi
          git commit -m "Wydanie ${{ steps.release.outputs.tag }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Tag i release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          ZIP: ${{ runner.temp }}/dist/gs_mapa.zip
        run: |
          set -euo pipefail
          notes=$(git -C "$RUNNER_TEMP/source" tag -l --format='%(contents)' "$TAG")
          title=$(printf '%s\n' "$notes" | head -n 1)
          if [ -z "$title" ]; then
            title="$TAG"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG już jest w tym repozytorium."
          else
            git tag -a "$TAG" -F "$RUNNER_TEMP/notes.md"
            git push origin "refs/tags/$TAG"
            echo "Utworzono tag $TAG."
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ZIP" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Utworzono release $TAG z archiwum gs_mapa.zip."
          elif ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'gs_mapa.zip'; then
            gh release upload "$TAG" "$ZIP"
            echo "Dograno gs_mapa.zip do release'a $TAG."
          else
            echo "Release $TAG jest już kompletny."
          fi
